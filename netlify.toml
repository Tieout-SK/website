# Tells Netlify how to build the site. Netlify's Next.js runtime picks up the
# .next output and serves the pages and the early access API route.
[build]
  command = "npm run build"
  publish = ".next"

# The Next.js runtime turns the build into pages and functions Netlify can serve.
# Without it the deploy "succeeds" but every page is "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
